<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衛星・センサー編集ツール</title>
<!--
  MIKAGE の衛星カタログ（satelliteCatalogs）・センサーモード（sensorCatalogs）・衛星名の対応表
  （satelliteAliases）・年間撮像上限（requestStores[].quotas）を、ArcGIS（ポータル・サーバー）のテーブルの上で
  直接編集するツール。
  ブラウザでこのファイルを開き、プラグインの設定ファイル（config.json）を読み込ませる。どのテーブルの
  どの属性を使うかは設定ファイルの url・fields・where のとおり（プラグインと同じ読み方）。
  ライブラリ・インストール不要（閉じたネットワークでも動く）。使うのは ArcGIS REST の query と applyEdits だけ。
  衛星とセンサーモードのつながり・別名のつながりはプラグインと同じ決まり（mikage/core/plan/modes.py with_modes、
  names.py、年間撮像上限は core/request/quota.py）。下の plugin-constants はプラグインの定数の写し: mikage/tests/test_satellite_editor.py が一致を確かめる。
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --text: #1d2433; --muted: #5d6677; --line: #d8dce3;
  --accent: #2257c9; --accent-bg: #e7eefc; --bad: #c62828; --bad-bg: #fdecec; --warn: #9a6200; --warn-bg: #fff4dc; --ok: #1b7f3b;
  --on-accent: #fff; --code: #eef1f5; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --panel: #1d2129; --panel2: #252a33; --text: #e4e7ec; --muted: #9aa3b2; --line: #343a46;
    --accent: #7ea6ff; --accent-bg: #23314f; --bad: #ff7b7b; --bad-bg: #3a2224; --warn: #f0b75a; --warn-bg: #3a3020; --ok: #6fd28f; --code: #262b35; --on-accent: #0d1a33;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #1d2129; --panel2: #252a33; --text: #e4e7ec; --muted: #9aa3b2; --line: #343a46;
  --accent: #7ea6ff; --accent-bg: #23314f; --bad: #ff7b7b; --bad-bg: #3a2224; --warn: #f0b75a; --warn-bg: #3a3020; --ok: #6fd28f; --code: #262b35; --on-accent: #0d1a33;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
header .file { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
header label.user { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
header label.user input { width: 150px; }
#signState { font-size: 12px; color: var(--muted); }
button, .button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; white-space: nowrap; }
button:hover, .button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; border-color: var(--line); }
button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.small { padding: 1px 8px; font-size: 12px; }
button.danger { color: var(--bad); }
button.danger:hover { border-color: var(--bad); }
button.danger.solid { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
button.current { border-color: var(--accent); color: var(--accent); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.layout { flex: 1; display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
nav { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
nav .top { padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
nav .top .bar { margin: 0; }
#satList { flex: 1; overflow: auto; padding: 4px 0 16px; }
#satList h2 { font-size: 12px; color: var(--muted); margin: 10px 12px 2px; font-weight: 600; }
.item { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 6px 12px; border-left: 3px solid transparent; }
.item:hover { background: var(--panel2); border-color: transparent; border-left-color: var(--line); }
.item.current { background: var(--accent-bg); border-left-color: var(--accent); }
.item .nm { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
.item .nm small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.item .sub { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.on { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
#main { overflow: auto; padding: 16px 20px 80px; }
.page { max-width: 1040px; }
h2.title { font-size: 19px; margin: 0 0 2px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
h2.title small { font-size: 12px; color: var(--muted); font-weight: 400; }
p.help { color: var(--muted); margin: 4px 0 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 12px 0; }
.card > .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; background: var(--panel2); border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.card > .head h3 { font-size: 14px; margin: 0; }
.card > .head .sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
.card > .body { padding: 8px 12px 12px; }
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px 8px; margin: 8px 0; min-width: 0; }
legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 14px; }
.grid .wide { grid-column: 1 / -1; }
.fld { padding: 4px 0; min-width: 0; }
.fld > .lab { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.fld > .lab code { color: var(--muted); font-size: 11px; }
.fld > .lab .unit { color: var(--muted); }
.fld small { display: block; color: var(--muted); font-size: 12px; }
.fld .err { color: var(--bad); font-size: 12px; }
.fld .warn { color: var(--warn); font-size: 12px; }
input[type=text], input[type=password], input[type=datetime-local], select, textarea { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); }
input:disabled, select:disabled, textarea:disabled { opacity: .65; }
textarea { min-height: 60px; resize: vertical; }
textarea.tle { font-family: var(--mono); font-size: 12px; min-height: 66px; white-space: pre; overflow-x: auto; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.changed { border-color: var(--accent) !important; background: var(--accent-bg) !important; }
.invalid { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.check { display: inline-flex; align-items: center; gap: 6px; padding-top: 4px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0; }
.bar .spacer { flex: 1; }
.bar.end { justify-content: flex-end; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
table.list th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.list td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list td.tools { white-space: nowrap; text-align: right; }
table.list tr.match td:first-child { font-weight: 600; }
.note { font-size: 12px; color: var(--muted); }
.box { border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.box.warn { background: var(--warn-bg); color: var(--warn); }
.box.bad { background: var(--bad-bg); color: var(--bad); }
.box.info { background: var(--accent-bg); color: var(--text); }
.box ul { margin: 4px 0 0; padding-left: 18px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.empty { color: var(--muted); padding: 8px 0; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); margin: 16px 0; }
body.dragging .drop { border-color: var(--accent); color: var(--accent); }
ol.steps { padding-left: 20px; }
ol.steps li { margin: 4px 0; }
code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 0 4px; border-radius: 3px; }
#status { position: fixed; left: 16px; bottom: 16px; max-width: min(640px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#status .msg { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 6px; padding: 8px 32px 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); position: relative; white-space: pre-wrap; }
#status .msg.warn { border-left-color: var(--warn); }
#status .msg.bad { border-left-color: var(--bad); }
#status .msg button { position: absolute; right: 4px; top: 4px; padding: 0 6px; border: 0; background: none; color: var(--muted); }
dialog.modal { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 14px 18px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; }
dialog.modal::backdrop { background: rgba(10, 14, 22, .45); }
dialog.modal h3 { margin: 0 0 8px; font-size: 16px; }
dialog.modal p { margin: 6px 0; }
dialog.modal ul { margin: 4px 0; padding-left: 20px; }
dialog.modal .err { color: var(--bad); font-size: 13px; white-space: pre-wrap; }
dialog.modal.busy { cursor: progress; }
dialog.modal.busy button { pointer-events: none; opacity: .6; }
.choices { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0; }
.choices label { display: inline-flex; gap: 4px; align-items: center; }
.hidden { display: none !important; }
.spin::after { content: " …"; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  #main { padding: 12px 16px 70px; }
  header label.user input { width: 120px; }
}
</style>
</head>
<body>
<header>
  <h1>衛星・センサー編集ツール</h1>
  <span class="file" id="fileName">設定ファイル未選択</span>
  <span class="spacer"></span>
  <label class="user" title="作成者・更新者の属性（editTracking）に入る名前。プラグインでは Windows のユーザー名（環境変数 USERNAME）が入る">作業者 <input id="userName" type="text" placeholder="ユーザー名" autocomplete="off"></label>
  <span id="signState"></span>
  <button id="btnSignIn" type="button">サインイン…</button>
  <button id="btnReload" type="button" disabled>読み直す</button>
  <label class="button primary" for="configInput">設定ファイルを開く…</label>
  <input id="configInput" type="file" accept=".json,.jsonc,application/json" class="hidden">
</header>
<div class="layout">
  <nav>
    <div class="top">
      <input id="search" type="text" placeholder="衛星名・ID・シリーズ・センサー・別名で絞り込み" autocomplete="off">
      <div class="bar"><button id="btnAdd" type="button" disabled>＋ 衛星を追加</button><span class="spacer"></span><button id="btnOrphans" type="button" class="small" disabled>つながりのない行</button></div>
    </div>
    <div id="satList"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="status"></div>
<div id="lists" class="hidden"></div>

<script type="application/json" id="plugin-constants">
{
 "satelliteRoles": [

 ]

</script>
<script>
"use strict";
const PC = JSON.parse(document.getElementById("plugin-constants").textContent);
const STORE_USER = "mikage.satelliteEditor.user";
const STORE_LAST = "mikage.satelliteEditor.lastConfig";
const STORE_LOGIN = "mikage.satelliteEditor.login";

/** 役割の見出し・単位・入力の候補（list は候補の datalist の名前）。 */
const SAT_INFO = {
  name: { label: "衛星名", hint: "空なら TLE の名前" },
  id: { label: "衛星 ID", hint: "NORAD 番号など。空なら衛星名" },
  tle: { label: "TLE" }, tle1: { label: "TLE 1 行目" }, tle2: { label: "TLE 2 行目" },
  maxOffNadir: { label: "最大オフナディア角", unit: "度", num: true },
  minOffNadir: { label: "最小オフナディア角", unit: "度", num: true },
  swath: { label: "観測幅", unit: "swath", num: true },
  length: { label: "シーン長", unit: "swath", num: true, hint: "空なら観測幅と同じ" },
  lookSide: { label: "観測方向", list: "lookSides", hint: "右・左・両方（空なら両方）" },
  kind: { label: "センサー種別", list: "kinds", hint: "光学・SAR など（sarPattern に合えば SAR）" },
  scenesPerPass: { label: "1 パスのシーン数", num: true, int: true },
  minInterval: { label: "最小撮像間隔", unit: "分", num: true },
  maxPerDay: { label: "1 日の上限", num: true, int: true, hint: "0 で制限なし" },
  shotsPerPass: { label: "1 パスの撮像回数", num: true, int: true, hint: "1 回のパス（同じ軌道方向の半周）で撮れる回数。空・0 で制限なし" },
  series: { label: "シリーズ", list: "series", hint: "空なら名前の末尾の番号を除いたもの" },
  leadTime: { label: "発注リードタイム", unit: "時間", num: true },
  sensor: { label: "センサー", list: "sensors", hint: "センサーモードのセンサー名。空ならシリーズ・衛星名で探す" },
  mode: { label: "センサーモード", list: "modes", hint: "モードごとに行を分けるときだけ" },
  resolution: { label: "分解能", unit: "m", num: true },
  system: { label: "衛星システム", list: "systems", hint: "発注するシステム（requestExports の system）" },
};
const SENSOR_INFO = {
  sensor: { label: "センサー名", list: "sensors" },
  mode: { label: "モード名", list: "modes", hint: "ストリップマップ・スポットライトなど" },
  kind: { label: "センサー種別", list: "kinds" },
  maxOffNadir: { label: "最大オフナディア角", unit: "度", num: true },
  minOffNadir: { label: "最小オフナディア角", unit: "度", num: true },
  swath: { label: "観測幅", unit: "swath", num: true },
  length: { label: "シーン長", unit: "swath", num: true },
  lookSide: { label: "観測方向", list: "lookSides" },
  scenesPerPass: { label: "1 パスのシーン数", num: true, int: true },
  minInterval: { label: "最小撮像間隔", unit: "分", num: true },
  maxPerDay: { label: "1 日の上限", num: true, int: true },
  shotsPerPass: { label: "1 パスの撮像回数", num: true, int: true, hint: "空なら衛星の値" },
  leadTime: { label: "発注リードタイム", unit: "時間", num: true },
  resolution: { label: "分解能", unit: "m", num: true },
  primary: { label: "既定モード", bool: true, hint: "そのセンサーのふだんのモード（1 つだけ）" },
};
const ALIAS_INFO = {
  satellite: { label: "衛星名", list: "satNames", hint: "衛星カタログの名前か ID" },
  alias: { label: "別名", hint: "画像カタログでの名前。カンマ区切りで複数も可（WV03, WV3）" },
};
const QUOTA_INFO = {
  sensor: { label: "センサー", list: "sensors", hint: "センサーモードのセンサー名（センサーがなければ衛星名か ID）" },
  mode: { label: "モード", list: "modes", hint: "空ならそのセンサーの全モードの合計" },
  limit: { label: "年間上限", unit: "枚", num: true, int: true, hint: "1 年に撮れるシーン数。空なら数えるだけ（割り当ては止めない）" },
  startMonth: { label: "年の始まりの月", num: true, int: true, hint: "1〜12。空なら 1 月（9 なら 9 月〜翌年 8 月）" },
  initialUsed: { label: "当初の消費枚数", unit: "枚", num: true, int: true, hint: "途中から使い始めた年に、それまでに使った枚数" },
  countFrom: { label: "数え始める日", day: true, hint: "当初の消費枚数の時点。この日からの撮像をプラグインが数える" },
  note: { label: "備考" },
};
const SAT_GROUPS = [
  ["基本", ["name", "id", "series", "kind", "sensor", "mode", "system"]],
  ["TLE", ["tle"]],
  ["撮像の諸元", ["maxOffNadir", "minOffNadir", "swath", "length", "lookSide", "resolution"]],
  ["撮像の制約", ["scenesPerPass", "minInterval", "maxPerDay", "shotsPerPass", "leadTime"]],
];
const SENSOR_GROUPS = [
  ["基本", ["sensor", "mode", "kind", "primary"]],
  ["撮像の諸元", ["maxOffNadir", "minOffNadir", "swath", "length", "lookSide", "resolution"]],
  ["撮像の制約", ["scenesPerPass", "minInterval", "maxPerDay", "shotsPerPass", "leadTime"]],
];
const DATE_TYPES = new Set(["esriFieldTypeDate", "esriFieldTypeTimestampOffset", "esriFieldTypeDateOnly"]);
const TEXT_TYPES = new Set(["esriFieldTypeString", "esriFieldTypeGUID", "esriFieldTypeGlobalID"]);
const INT_TYPES = new Set(["esriFieldTypeInteger", "esriFieldTypeSmallInteger", "esriFieldTypeBigInteger", "esriFieldTypeOID"]);
const REAL_TYPES = new Set(["esriFieldTypeDouble", "esriFieldTypeSingle"]);
const SYSTEM_TYPES = new Set(["esriFieldTypeOID", "esriFieldTypeGlobalID", "esriFieldTypeGeometry", "esriFieldTypeRaster", "esriFieldTypeBlob", "esriFieldTypeXML"]);
const LAYER_URL = /\/(FeatureServer|MapServer)\/\d+\/?$/i;
const YES = /^(1|true|yes|y|はい|既定|標準)$/i;
const TLE_OLD_DAYS = 14;

// ---------------------------------------------------------------- 小道具

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;

  const t = { enabled: true, user: "", userVariable: "USERNAME", fields: { ...PC.editTrackingFields } };
  if (v === false) return { ...t, enabled: false };
  if (v === undefined || v === null || v === true) return t;
  if (!isObj(v)) { problems.push(warnP("editTracking は false かオブジェクトで指定")); return t; }
  if (typeof v.enabled === "boolean") t.enabled = v.enabled;
  if (typeof v.userVariable === "string" && v.userVariable.trim()) t.userVariable = v.userVariable.trim();
  if (typeof v.user === "string") t.user = v.user.trim();
  if (isObj(v.fields)) for (const [role, name] of Object.entries(v.fields)) {
    if (!(role in t.fields)) continue;
    t.fields[role] = typeof name === "string" ? name.trim() : "";
  }
  return t;
}

// ---------------------------------------------------------------- ArcGIS REST

class EsriError extends Error {
  constructor(message, code = 0) { super(message); this.code = code; }
}
/** サインインで得たトークン（サーバーの根元の URL ごと）。ページを閉じれば消える。 */
const tokens = new Map();
let sendCredentials = false;
/** サービスの URL の根元: https://gis.example/arcgis/rest/services/… → https://gis.example/arcgis。 */
function serverRoot(url) {
  const m = url.match(/^(.*?)\/rest\/services(\/|$)/i);
  if (m) return m[1];
  try { return new URL(url).origin; } catch (e) { return url; }
}
const pendingSignIns = new Map();
/**
 * ArcGIS REST への要求（いつも POST の form: 単純な要求なので CORS の事前確認が要らない）。
 * トークンがない・切れた（499・498）ときはサインインを出して 1 度だけやり直す。
 */
async function esri(url, params = {}, opt = {}) {
  const root = serverRoot(url);
  const form = new URLSearchParams();
  for (const [k, v] of Object.entries({ ...params, f: "json" })) if (v !== undefined && v !== null) form.set(k, typeof v === "string" ? v : JSON.stringify(v));
  const signed = tokens.get(root);
  const token = opt.noToken ? null : (signed && (!signed.expires || signed.expires > Date.now() + 30000) ? signed.token : opt.token);
  if (token) form.set("token", token);
  let res, body;
  try {
    res = await fetch(url, { method: "POST", body: form, credentials: sendCredentials ? "include" : "same-origin", cache: "no-store" });
    body = await res.text();
  } catch (e) {
    throw new EsriError(`サーバーに届かない（${url}）。URL・ネットワーク、またはサーバーの CORS の設定（このページからの要求を許しているか）を確かめる`);
  }
  let json;
  try { json = JSON.parse(body); } catch (e) {
    throw new EsriError(`応答が JSON でない（HTTP ${res.status}${res.status === 401 || res.status === 403 ? "。サインインが要るかもしれない（「ブラウザの資格情報」を試す）" : ""}）`, res.status);
  }
  if (json && json.error) {
    const code = Number(json.error.code) || res.status;
    const details = Array.isArray(json.error.details) ? json.error.details.filter(Boolean) : [];
    const message = `${json.error.message || "エラー"}${details.length ? `（${details.join(" / ")}）` : ""}`;
    if ((code === 498 || code === 499) && opt.retry !== false && !opt.noToken) {
      if (await signIn(root, code === 498 ? "トークンが無効か期限切れ" : "トークンが必要")) return esri(url, params, { ...opt, retry: false });
    }
    throw new EsriError(message, code);
  }
  return json;
}
async function layerInfo(src) {
  const info = await esri(src.url, {}, { token: src.token });
  if (!Array.isArray(info.fields)) throw new EsriError("レイヤーの情報に fields がない（テーブルの URL か確かめる）");
  src.info = info;
  src.byLower = new Map(info.fields.map((f) => [f.name.toLowerCase(), f]));
  src.oidField = info.objectIdField || (info.fields.find((f) => f.type === "esriFieldTypeOID") || {}).name;
  if (!src.oidField) throw new EsriError("ObjectID の属性がない");
  return info;
}
const fieldOf = (src, name) => (name ? src.byLower.get(name.toLowerCase()) || null : null);
const roleField = (src, role) => fieldOf(src, src.fields[role]);
/** where に合う行すべて（ページに分けて。ページできないレイヤーは ID から）: esri.py の query_all。 */
async function queryAll(src, where) {
  const info = src.info;
  const size = Math.max(1, Math.min(2000, info.maxRecordCount || 1000));
  const base = { where: where || "1=1", outFields: "*", returnGeometry: "false" };
  const out = [];
  if (info.advancedQueryCapabilities && info.advancedQueryCapabilities.supportsPagination) {
    for (let offset = 0; offset < 1e6;) {
      const r = await esri(`${src.url}/query`, { ...base, orderByFields: src.oidField, resultOffset: String(offset), resultRecordCount: String(size) }, { token: src.token });
      const feats = r.features || [];
      out.push(...feats);
      if (!feats.length || !(r.exceededTransferLimit || feats.length >= size)) break;
      offset += feats.length;
    }
  } else {
    const ids = await queryIds(src, where);
    for (let i = 0; i < ids.length; i += size) {
      const r = await esri(`${src.url}/query`, { objectIds: ids.slice(i, i + size).join(","), outFields: "*", returnGeometry: "false" }, { token: src.token });
      out.push(...(r.features || []));
    }
  }
  return out.map((f) => f.attributes || {});
}
async function queryIds(src, where) {
  const r = await esri(`${src.url}/query`, { where: where || "1=1", returnIdsOnly: "true" }, { token: src.token });
  return (r.objectIds || []).slice().sort((a, b) => a - b);
}
/** 1 行の今の値（なければ null）。 */
async function fetchRow(src, oid) {
  const r = await esri(`${src.url}/query`, { objectIds: String(oid), outFields: "*", returnGeometry: "false" }, { token: src.token });
  return r.features && r.features.length ? r.features[0].attributes || {} : null;
}

// ---- 作成者・更新者（edit_stamp.py と同じ: レイヤーにある属性だけ）

function currentUser() {
  const t = S.cfg && S.cfg.tracking;
  return (t && t.user) || $("userName").value.trim();
}
function trackedFields(src) {
  const t = S.cfg && S.cfg.tracking;
  if (!t || !t.enabled) return {};
  const out = {};
  for (const [role, name] of Object.entries(t.fields)) { const f = fieldOf(src, name); if (f) out[role] = f; }
  return out;
}
function needsUser(src) {
  const f = trackedFields(src);
  return Boolean(f.createdBy || f.updatedBy);
}
function stampValues(src, adding, when) {
  const fields = trackedFields(src), user = currentUser(), out = {};
  for (const role of adding ? Object.keys(PC.editTrackingFields) : PC.editTrackingUpdateRoles) {
    const f = fields[role];
    if (!f) continue;
    if (role.endsWith("By")) { if (user && (TEXT_TYPES.has(f.type) || !f.type)) out[f.name] = user; }
    else if (DATE_TYPES.has(f.type) || !f.type) out[f.name] = writeInstant(src, when);
    else if (TEXT_TYPES.has(f.type)) out[f.name] = new Date(when).toISOString();
    else if (INT_TYPES.has(f.type) || REAL_TYPES.has(f.type)) out[f.name] = when;
  }
  return out;
}
/** 名前の要る属性があるのに作業者が空なら止める。 */
function requireUser(srcs) {
  if (srcs.some(needsUser) && !currentUser()) {
    $("userName").classList.add("invalid");
    $("userName").focus();
    throw new EsriError("右上の「作業者」に名前を入れる（作成者・更新者の属性に入る。プラグインでは Windows のユーザー名）");
  }
}
/** applyEdits（1 テーブルの追加・更新・削除をまとめて。失敗が 1 つでもあれば全部取り消す）。 */
async function applyEdits(src, { adds = [], updates = [], deletes = [] }) {
  if (!adds.length && !updates.length && !deletes.length) return null;
  const when = Date.now();
  const params = { rollbackOnFailure: src.info.supportsRollbackOnFailureParameter === false ? "false" : "true" };
  if (adds.length) params.adds = JSON.stringify(adds.map((a) => ({ attributes: { ...a, ...stampValues(src, true, when) } })));
  if (updates.length) params.updates = JSON.stringify(updates.map((a) => ({ attributes: { ...a, ...stampValues(src, false, when) } })));
  if (deletes.length) params.deletes = deletes.join(",");
  const r = await esri(`${src.url}/applyEdits`, params, { token: src.token });
  const results = [...(r.addResults || []), ...(r.updateResults || []), ...(r.deleteResults || [])];
  const failed = results.filter((x) => !x.success);
  if (failed.length) {
    const reason = failed.map((x) => (x.error && x.error.description) || "").find(Boolean);
    throw new EsriError(`${src.label}: ${failed.length} 件の書き込みに失敗${reason ? `（${reason}）` : ""}`);
  }
  if (results.length < adds.length + updates.length + deletes.length) throw new EsriError(`${src.label}: 書き込みの結果が足りない（サーバーの応答を確かめる）`);
  return r;
}

// ---------------------------------------------------------------- サインイン

function signInRoots() {
  const roots = new Set();
  if (S.cfg) for (const s of [...S.cfg.sats, ...S.cfg.sensors, ...S.cfg.aliases]) roots.add(serverRoot(s.url));
  return [...roots];
}
function signIn(root, reason) {
  if (pendingSignIns.has(root)) return pendingSignIns.get(root);
  const p = signInDialog(root, reason).finally(() => pendingSignIns.delete(root));
  pendingSignIns.set(root, p);
  return p;
}
async function signInDialog(root, reason) {
  const remembered = store.get(STORE_LOGIN) || "";
  const user = el("input", { type: "text", value: remembered, autocomplete: "username" });
  const pass = el("input", { type: "password", autocomplete: "current-password" });
  const pasted = el("textarea", { rows: 3, placeholder: "ポータルなどで発行したトークン" });
  const how = el("div", { class: "choices" });
  const panes = {
    password: el("div", {}, field2("ユーザー名", user), field2("パスワード", pass),
      el("p", { class: "note", text: "サーバー（かポータル）の generateToken でトークンを発行する。パスワードは控えない。トークンはこのページを閉じれば消える" })),
    token: el("div", { class: "hidden" }, field2("トークン", pasted)),
    browser: el("div", { class: "hidden" }, el("p", { class: "note", text: "ブラウザがサーバーにサインイン済みの資格情報（統合 Windows 認証・Cookie）を要求に付ける。サーバーの CORS の設定でこのページが許されている必要がある" })),
  };
  let mode = "password";
  for (const [k, label] of [["password", "ユーザー名とパスワード"], ["token", "トークンを貼り付け"], ["browser", "ブラウザの資格情報（統合 Windows 認証など）"]]) {
    how.append(el("label", {}, el("input", { type: "radio", name: "how", value: k, checked: k === mode, onchange: () => { mode = k; for (const [n, p] of Object.entries(panes)) p.classList.toggle("hidden", n !== k); } }), label));
  }
  setTimeout(() => (remembered ? pass : user).focus(), 30);
  const ok = await modal("サインイン", [
    el("p", {}, el("b", { text: root }), reason ? el("span", { class: "note", text: `（${reason}）` }) : null),
    how, panes.password, panes.token, panes.browser,
  ], [{ label: "やめる", value: null }, { label: "サインイン", value: true, cls: "primary" }], async () => {
    if (mode === "token") {
      if (!pasted.value.trim()) throw new Error("トークンを貼り付ける");
      tokens.set(root, { token: pasted.value.trim(), user: "（トークン）", expires: 0 });
      return true;
    }
    if (mode === "browser") { sendCredentials = true; tokens.delete(root); return true; }
    if (!user.value.trim() || !pass.value) throw new Error("ユーザー名とパスワードを入れる");
    const info = await esri(`${root}/rest/info`, {}, { noToken: true });
    const auth = info.authInfo || {};
    if (!auth.tokenServicesUrl) throw new Error(auth.isTokenBasedSecurity === false ? "このサーバーはトークンでのサインインを使わない設定（「ブラウザの資格情報」を試す）" : "サーバーの情報にトークンの発行先（tokenServicesUrl）がない");
    const tokenUrl = new URL(auth.tokenServicesUrl, `${root}/`).href;
    const r = await esri(tokenUrl, { username: user.value.trim(), password: pass.value, client: "requestip", expiration: "240" }, { noToken: true });
    if (!r.token) throw new Error("トークンが発行されなかった");
    tokens.set(root, { token: r.token, user: user.value.trim(), expires: isNum(r.expires) ? r.expires : 0 });
    store.set(STORE_LOGIN, user.value.trim());
    return true;
  });
  showSignState();

}
function field2(label, input) {
  return el("div", { class: "fld" }, el("div", { class: "lab", text: label }), input);
}
function showSignState() {
  const parts = [...tokens.entries()].map(([root, t]) => `${t.user}（${root.replace(/^https?:\/\//, "")}）`);
  if (sendCredentials) parts.push("ブラウザの資格情報");
  $("signState").textContent = parts.length ? `サインイン: ${parts.join("・")}` : "";

// ---------------------------------------------------------------- 状態と読み込み

const S = {
  cfg: null, fileName: "", loading: false,
  sats: [], modes: [], aliases: [], quotas: [],
  /** { kind: "sat", rec } | { kind: "new", src, start } | { kind: "orphans" } | null */
  sel: null,
  form: null,
  filter: "",

async function openConfigText(src, name, remember = true) {
  if (S.form && S.form.dirty() && !(await discardChanges())) return;
  let value;
  try { value = loadJsonc(src); } catch (e) { return status(`${name}: ${e.message}`, "bad"); }
  S.cfg = parseConfig(value);
  S.fileName = name;
  S.sel = null;
  S.form = null;
  $("fileName").textContent = name;
  if (remember) store.set(STORE_LAST, JSON.stringify({ name, at: Date.now(), config: withoutTokens(value) }));
  if (!$("userName").value.trim() && S.cfg.tracking.user) $("userName").value = S.cfg.tracking.user;
  await loadAll();
}
async function loadAll(keep) {
  if (!S.cfg) return;
  S.loading = true;
  renderSide();
  if (!keep) renderMain();
  const all = [...S.cfg.sats, ...S.cfg.sensors, ...S.cfg.aliases, ...S.cfg.quotas];
  await Promise.all(all.map(loadSource));
  S.sats = S.cfg.sats.flatMap((s) => s.records);
  S.modes = S.cfg.sensors.flatMap((s) => s.records);
  S.aliases = S.cfg.aliases.flatMap((s) => s.records);
  S.quotas = S.cfg.quotas.flatMap((s) => s.records);
  S.loading = false;
  relink();
  if (keep) S.sel = keep();
  else if (S.sel && S.sel.kind === "sat") S.sel = findSel(S.sel.rec);
  S.form = null;
  buildLists();
  renderSide();
  renderMain();
  const failed = all.filter((s) => s.error);
  if (failed.length) status(failed.map((s) => `${s.label}: ${s.error}`).join("\n"), "bad", true);
}
async function loadSource(src) {
  src.error = null;
  src.records = [];
  src.problems = [];
  try {
    await layerInfo(src);
    for (const [role, name] of Object.entries(src.fields)) if (!fieldOf(src, name)) src.problems.push(warnP(`fields.${role} の「${name}」がテーブルにない（この項目は編集できない）`));
    if (src.info.capabilities && !/\b(Update|Editing)\b/i.test(src.info.capabilities)) src.problems.push(badP(`このテーブルは編集できない設定（capabilities: ${src.info.capabilities}）。サービスで「作成・更新・削除」を許す`));
    const rows = await queryAll(src, "1=1");
    let inWhere = null;
    if (src.where) {
      try { inWhere = new Set(await queryIds(src, src.where)); }
      catch (e) { src.problems.push(warnP(`where「${src.where}」で絞り込めない（${e.message}）`)); }
    }
    src.records = rows.map((a) => ({ src, oid: attr(a, src.oidField), a, out: inWhere ? !inWhere.has(attr(a, src.oidField)) : false }));

}
function findSel(rec) {
  if (!rec) return null;

  return r ? { kind: "sat", rec: r } : null;
}
const get = (rec, role) => (rec.src.fields[role] ? attr(rec.a, rec.src.fields[role]) : undefined);

/** 衛星 1 行の読み方（satellites.py の satellite_of と同じ名前・ID・シリーズ）。 */
function satView(rec) {
  const src = rec.src;
  const tleText = src.fields.tle ? jsString(get(rec, "tle")) : `${jsString(get(rec, "tle1"))}\n${jsString(get(rec, "tle2"))}`;
  const tle = tleLines(tleText);
  const raw = get(rec, "name");
  let name = (raw !== undefined && raw !== null ? jsString(raw) : tle ? tle.name : "").trim();
  if (!name && tle) name = `NORAD ${tle.tle1.slice(2, 7).trim()}`;
  return {
    name, id: text(get(rec, "id")) || name, series: text(get(rec, "series")) || seriesOf(name),

function modeSensor(m) { return text(attr(m.a, m.src.fields.sensor)); }
function modeName(m) { return text(attr(m.a, m.src.fields.mode)); }

/** センサーモードのセンサー名（小文字）ごとの行。 */
let byKey = new Map();

  for (const r of S.sats) {
    r.v = satView(r);
    r.v.sensorKey = sensorKeyOf(r.v);
    r.v.modes = r.v.sensorKey ? byKey.get(r.v.sensorKey) : [];
    const names = new Set([plain(r.v.name), plain(r.v.id)].filter(Boolean));

/** そのセンサー名を使う衛星（rec 以外）。 */
const sensorUsers = (key, except) => S.sats.filter((r) => r !== except && r.v.sensorKey === key);

const nameOwners = (p, except) => S.sats.filter((r) => r !== except && p && (plain(r.v.name) === p || plain(r.v.id) === p));

// ---------------------------------------------------------------- 画面の部品

function status(msg, level = "ok", sticky = false) {
  const box = el("div", { class: `msg ${level}`, text: msg });
  box.append(el("button", { type: "button", text: "×", title: "閉じる", onclick: () => box.remove() }));
  $("status").append(box);
  while ($("status").children.length > 4) $("status").firstChild.remove();
  if (!sticky && level !== "bad") setTimeout(() => box.remove(), level === "warn" ? 9000 : 4500);
}
/** 待つダイアログ（ボタンの値を返す。act があれば押したときに実行し、失敗すれば開いたまま理由を出す）。 */
function modal(title, content, buttons, act) {
  return new Promise((resolve) => {
    const d = el("dialog", { class: "modal" });
    const msg = el("div", { class: "err" });
    const bar = el("div", { class: "bar end" });
    let busy = false;
    const finish = (v) => { d.close(); d.remove(); resolve(v); };
    for (const b of buttons) {
      bar.append(el("button", {
        type: "button", class: b.cls, text: b.label,
        onclick: async () => {
          if (busy) return;
          if (b.value === null || !act) return finish(b.value);
          busy = true;
          msg.textContent = "";
          d.classList.add("busy");
          try {
            const r = await act(b.value, msg);
            if (r !== false) finish(r === undefined ? b.value : r);
          } catch (e) {
            msg.textContent = e.message;
          } finally {
            busy = false;
            d.classList.remove("busy");
          }
        },
      }));
    }
    d.addEventListener("cancel", (e) => { e.preventDefault(); if (!busy) finish(null); });
    d.append(el("h3", { text: title }), ...content.filter(Boolean), msg, bar);
    document.body.append(d);
    d.showModal();
  });
}
async function confirmBox(title, content, okLabel, danger = false) {
  return (await modal(title, content, [{ label: "やめる", value: null }, { label: okLabel, value: true, cls: danger ? "danger solid" : "primary" }])) === true;

      const names = [...new Set(users.flatMap((r) => satModes(r.v)))];
      if (mode && names.length && !names.some((x) => plain(x) === plain(mode))) msgs.push(`モード「${mode}」は「${sensor}」のモード（${names.join("・")}）にない（どの撮像も数えない）`);
      infos.push(`数える衛星: ${users.map((r) => r.v.name + (r.v.mode ? `・${r.v.mode}` : "")).join("、")}${mode ? `（モード「${mode}」の撮像だけ）` : "（全モードの撮像）"}`);
    }
    const twins = quotaTwins(sensor, mode, q);
    if (twins.length) msgs.push(`同じセンサー・モードの行がもうある（${twins.map(recordMeta).join("・")}）。1 行にまとめる`);
    note.replaceChildren(...(msgs.length ? [el("div", { class: "box warn" }, el("ul", {}, msgs.map((x) => el("li", { text: x }))))] : []),
      ...infos.map((x) => el("p", { class: "note", text: x })));
  }
  const pick = !q && tables.length > 1 ? el("select", { onchange: () => { src = tables.find((t) => t.id === pick.value); build(); } }, tables.map((t) => el("option", { value: t.id, text: t.label }))) : null;
  build();
  const done = await modal(q ? "年間撮像上限の編集" : "年間撮像上限の追加", [
    pick ? el("div", { class: "fld", style: "max-width: 360px" }, el("div", { class: "lab", text: "追加するテーブル" }), pick) : null,
    container, note,
  ], [{ label: "やめる", value: null }, { label: q ? "保存" : "追加", value: true, cls: "primary" }], async () => {
    const changes = {}, errors = [];
    for (const it of items) {
      const x = it.fi.read();
      const bad = x.error || (it.info ? checkRole(it.info, x.value) : null);
      it.fi.err.textContent = bad || "";
      it.fi.input.classList.toggle("invalid", Boolean(bad));
      if (bad) { errors.push(`${it.info ? it.info.label : it.fi.field.alias || it.fi.field.name}: ${bad}`); continue; }
      if (q && !it.fi.dirty()) continue;
      if (!q && (x.value === null || x.value === "")) continue;
      changes[it.fi.field.name] = x.value;
    }
    const sensor = value("sensor"), month = value("startMonth");
    if (!sensor) errors.push("センサーを入れる");
    if (month && !(Number(month) >= 1 && Number(month) <= 12)) errors.push("年の始まりの月は 1〜12");
    if (Number(value("initialUsed")) > 0 && item("countFrom") && !value("countFrom")) errors.push("当初の消費枚数を入れたら、数え始める日（その枚数の時点）も入れる");
    if (quotaTwins(sensor, value("mode"), q).length) errors.push("同じセンサー・モードの行がもうある（その行を直す）");
    if (errors.length) throw new Error(errors.join("\n"));
    if (q && !Object.keys(changes).length) return true;
    requireUser([src]);
    if (q) {
      const latest = await fetchRow(src, q.oid);
      if (!latest) throw new Error("この行はほかの人が削除した（閉じて読み直す）");
      const c = await resolveConflict(src, q.a, latest);
      if (c === "reload") return null;
      if (c !== true) return false;
      await applyEdits(src, { updates: [{ [src.oidField]: q.oid, ...changes }] });
    } else await applyEdits(src, { adds: [changes] });
    status(`${q ? "保存" : "追加"}した（年間撮像上限「${sensor}（${value("mode") || "全モード"}）」）`);
    return true;
  });
  if (done) await loadAll(() => (rec ? findSel(rec) : S.sel));
}
async function deleteQuota(rec, q) {
  const ok = await confirmBox("年間撮像上限の削除", [el("p", { text: `年間撮像上限「${quotaLabel(q)}」の行を削除する。元に戻せない（プラグインはこのセンサー・モードの割り当てを上限で止めなくなる）。` })], "削除する", true);
  if (!ok) return;
  try {
    await applyEdits(q.src, { deletes: [q.oid] });
    status(`削除した（年間撮像上限「${quotaLabel(q)}」）`);
  } catch (e) { status(e.message, "bad"); }
  await loadAll(() => (rec ? findSel(rec) : S.sel));
}

// ---- つながりのない行

function orphanRows() {
  const used = new Set(S.sats.map((r) => r.v.sensorKey).filter(Boolean));
  const modes = S.modes.filter((m) => !used.has(keyOf(modeSensor(m))));
  const names = new Set(S.sats.flatMap((r) => [plain(r.v.name), plain(r.v.id)]).filter(Boolean));
  const aliases = S.aliases.filter((r) => !names.has(plain(aliasSat(r))));
  const linked = new Set(S.sats.flatMap((r) => r.v.quotas));
  const quotas = S.quotas.filter((q) => !linked.has(q));
  return { modes, aliases, quotas };
}
function orphansPage() {
  const { modes, aliases, quotas } = orphanRows();
  const out = [el("h2", { class: "title", text: "つながりのない行" }),
    el("p", { class: "help", text: "どの衛星にも使われないセンサーモード、カタログにない衛星名の別名、どの衛星のセンサーにも合わない年間撮像上限。衛星を消した残り・名前の打ち間違いなど。衛星の名前・センサー名を直すか、ここで消す。" })];
  const sbody = el("div", { class: "body" });
  out.push(el("div", { class: "card" }, el("div", { class: "head" }, el("h3", { text: `センサーモード（${modes.length}）` })), sbody));
  if (!modes.length) sbody.append(el("p", { class: "empty", text: "なし" }));
  const groups = new Map();
  for (const m of modes) { const k = `${m.src.id}\n${keyOf(modeSensor(m))}`; (groups.get(k) || groups.set(k, []).get(k)).push(m); }
  for (const list of groups.values()) {
    const name = modeSensor(list[0]) || "（センサー名なし）";
    sbody.append(el("div", { class: "bar" }, el("b", { text: `センサー「${name}」` }), el("span", { class: "note", text: `${list[0].src.label}・${list.length} 件` }), el("span", { class: "spacer" }),
      el("button", { type: "button", class: "small danger", text: "このセンサーのモードを全部削除", onclick: () => deleteRows(list, `センサー「${name}」のモード ${list.length} 件`) })));
    const t = el("table", { class: "list" });
    for (const m of list) t.append(el("tr", {}, el("td", { text: modeName(m) || "（モード名なし）" }), el("td", { class: "note", text: recordMeta(m) }),
      el("td", { class: "tools" }, el("button", { type: "button", class: "small", text: "編集", onclick: () => editMode(null, m) }), " ",
        el("button", { type: "button", class: "small danger", text: "削除", onclick: () => deleteMode(null, m) }))));
    sbody.append(t);
  }
  const abody = el("div", { class: "body" });
  out.push(el("div", { class: "card" }, el("div", { class: "head" }, el("h3", { text: `別名（${aliases.length}）` })), abody));
  if (!aliases.length) abody.append(el("p", { class: "empty", text: "なし" }));
  else {
    const t = el("table", { class: "list" }, el("tr", {}, el("th", { text: "表の衛星名" }), el("th", { text: "別名" }), el("th", {})));
    for (const r of aliases) t.append(el("tr", {}, el("td", { text: aliasSat(r) || "（空）" }), el("td", { text: aliasText(r) }),
      el("td", { class: "tools" }, el("button", { type: "button", class: "small", text: "編集", onclick: () => editAlias(null, r) }), " ",
        el("button", { type: "button", class: "small danger", text: "削除", onclick: () => deleteAlias(null, r) }))));
    abody.append(t, el("div", { class: "bar" }, el("button", { type: "button", class: "small danger", text: "別名を全部削除", onclick: () => deleteRows(aliases, `別名 ${aliases.length} 行`) })));
  }
  if (S.cfg.quotas.length) {
    const qbody = el("div", { class: "body" });
    out.push(el("div", { class: "card" }, el("div", { class: "head" }, el("h3", { text: `年間撮像上限（${quotas.length}）` })), qbody));
    if (!quotas.length) qbody.append(el("p", { class: "empty", text: "なし" }));
    else {
      const t = el("table", { class: "list" }, el("tr", {}, el("th", { text: "センサー" }), el("th", { text: "モード" }), el("th", { text: "年間上限" }), el("th", {})));
      for (const q of quotas) t.append(el("tr", {}, el("td", { text: quotaSensor(q) || "（空）" }), el("td", { text: quotaMode(q) || "全モード" }), el("td", { text: text(quotaGet(q, "limit")) }),
        el("td", { class: "tools" }, el("button", { type: "button", class: "small", text: "編集", onclick: () => editQuota(null, q) }), " ",
          el("button", { type: "button", class: "small danger", text: "削除", onclick: () => deleteQuota(null, q) }))));
      qbody.append(t);
    }
  }
  return out;
}
async function deleteRows(rows, what) {
  if (!(await confirmBox("削除", [el("p", { text: `${what}を削除する。元に戻せない。` })], "削除する", true))) return;
  try {
    for (const t of new Set(rows.map((r) => r.src))) await applyEdits(t, { deletes: rows.filter((r) => r.src === t).map((r) => r.oid) });
    status(`削除した（${what}）`);
  } catch (e) { status(e.message, "bad"); }
  await loadAll(() => S.sel);
}

// ---------------------------------------------------------------- はじめ

$("configInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (file) await openConfigText(await file.text(), file.name);
});
$("btnReload").addEventListener("click", async () => {
  if (S.form && S.form.dirty() && !(await discardChanges())) return;
  S.form = null;
  await loadAll(() => (S.sel && S.sel.kind === "sat" ? findSel(S.sel.rec) : S.sel && S.sel.kind === "orphans" ? S.sel : null));
});
$("btnAdd").addEventListener("click", () => { const s = S.cfg.sats.find((x) => x.info && !x.error); if (s) startNew(s); });
$("btnOrphans").addEventListener("click", () => select({ kind: "orphans" }));
$("btnSignIn").addEventListener("click", async () => {
  const roots = signInRoots();
  if (!roots.length) return status("先に設定ファイルを開く（サインイン先は設定ファイルのサービスのサーバー）", "warn");
  let root = roots[0];
  if (roots.length > 1) {
    const pick = el("select", {}, roots.map((r) => el("option", { value: r, text: r })));
    if (!(await modal("サインインするサーバー", [pick], [{ label: "やめる", value: null }, { label: "次へ", value: true, cls: "primary" }]))) return;
    root = pick.value;
  }
  if (await signIn(root, "")) await loadAll(() => (S.sel && S.sel.kind === "sat" ? findSel(S.sel.rec) : S.sel));
});
$("search").addEventListener("input", (e) => { S.filter = e.target.value; renderSide(); });
$("userName").value = store.get(STORE_USER) || "";
$("userName").addEventListener("input", (e) => { e.target.classList.remove("invalid"); store.set(STORE_USER, e.target.value.trim()); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && S.form && !document.querySelector("dialog[open]")) { e.preventDefault(); saveSatellite(S.form); }
});
window.addEventListener("beforeunload", (e) => { if (S.form && S.form.dirty()) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  const file = e.dataTransfer.files[0];
  if (file) await openConfigText(await file.text(), file.name);
});
renderSide();
renderMain();
</script>
