<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定ファイル作成ツール</title>
<!--
  衛星撮像計画・観測記録プラグインの設定ファイル（config.json）を作る・直すツール。
  ブラウザでこのファイルを開くだけで動く（サーバー・ネットワーク・ライブラリ不要）。
  項目と既定はプラグインの satellite_observation/core/config.py（KEYS と各項目の読み込み処理）に合わせてある。
  下の plugin-constants はプラグインの定数の写し: satellite_observation/tests/test_config_builder.py が一致を確かめる。
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --text: #1d2433; --muted: #5d6677; --line: #d8dce3;
  --accent: #2257c9; --accent-bg: #e7eefc; --bad: #c62828; --bad-bg: #fdecec; --warn: #9a6200; --ok: #1b7f3b;
  --code: #eef1f5; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181e; --panel: #1d2129; --panel2: #252a33; --text: #e4e7ec; --muted: #9aa3b2; --line: #343a46;
    --accent: #7ea6ff; --accent-bg: #23314f; --bad: #ff7b7b; --bad-bg: #3a2224; --warn: #f0b75a; --ok: #6fd28f; --code: #262b35;
  }
}
:root[data-theme="dark"] {
  --bg: #15181e; --panel: #1d2129; --panel2: #252a33; --text: #e4e7ec; --muted: #9aa3b2; --line: #343a46;
  --accent: #7ea6ff; --accent-bg: #23314f; --bad: #ff7b7b; --bad-bg: #3a2224; --warn: #f0b75a; --ok: #6fd28f; --code: #262b35;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
header .file { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
button, .button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
button:hover, .button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 1px 8px; font-size: 12px; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
.layout { flex: 1; display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(300px, 34%); min-height: 0; }
nav { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 0 24px; }
nav h2 { font-size: 12px; color: var(--muted); margin: 14px 14px 4px; font-weight: 600; }
nav a { display: flex; align-items: center; gap: 6px; padding: 3px 14px; color: var(--text); text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--panel2); }
nav a.current { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
nav a .n { margin-left: auto; font-size: 11px; color: var(--muted); }
nav a .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; flex: none; }
nav a.set .dot { background: var(--ok); }
nav a.bad .dot { background: var(--bad); }
#editor { overflow: auto; padding: 16px 20px 80px; }
aside { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
aside h3 { font-size: 13px; margin: 4px 0; }
#problems { margin: 0; padding-left: 18px; font-size: 12px; max-height: 32vh; overflow: auto; }
#problems li { color: var(--bad); }
#problems li.warn { color: var(--warn); }
#problems.none { list-style: none; padding-left: 0; }
#problems.none li { color: var(--ok); }
pre, textarea, code, input.mono { font-family: var(--mono); font-size: 12px; }
#preview { flex: 1; margin: 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto; white-space: pre; min-height: 200px; }
h2.key { font-size: 18px; margin: 0 0 2px; }
h2.key code { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 8px; }
p.help { color: var(--muted); margin: 4px 0 12px; }
.row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 5px 0; }
.row > .lab { padding-top: 5px; }
.row > .lab code { display: block; color: var(--muted); font-size: 11px; }
.row .req { color: var(--bad); margin-left: 2px; }
.row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
input[type=text], input[type=number], select, textarea { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.invalid { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.err { color: var(--bad); font-size: 12px; }
.roles { display: grid; grid-template-columns: minmax(130px, max-content) minmax(0, 1fr); gap: 3px 8px; align-items: center; }
.roles span { font-size: 12px; }
.roles span code { color: var(--muted); font-size: 11px; margin-left: 4px; }
.pairs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 10px 0; }
.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel2); border-radius: 8px; }
.card[open] > summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.card > summary::-webkit-details-marker { display: none; }
.card > summary .title { font-weight: 600; }
.card > summary .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.card > summary .tools { display: flex; gap: 4px; }
.card > .body { padding: 6px 12px 10px; }
.card.bad > summary .title::after { content: " ●"; color: var(--bad); }
fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px 8px; margin: 4px 0; min-width: 0; }
legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
.note { font-size: 12px; color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 5px; }
.choices label { display: inline-flex; gap: 4px; align-items: center; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.overview a { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); text-decoration: none; }
.overview a:hover { border-color: var(--accent); }
.overview a b { display: block; }
.overview a span { font-size: 12px; color: var(--muted); }
/* JSON Schema の木 */
.node { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; margin: 4px 0 4px 4px; }
.node-head { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.node-head input[type=text], .node-head select { width: auto; padding: 3px 6px; font-size: 13px; }
.node-head input.name { width: 150px; font-family: var(--mono); }
.node-head input.short { width: 110px; }
.node-head select { max-width: 260px; }
.node-head label { font-size: 12px; display: inline-flex; gap: 3px; align-items: center; }
.node .other { font-size: 11px; color: var(--muted); }
.tag { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--accent-bg); color: var(--accent); }
.sample { margin: 6px 0 0; padding: 8px; background: var(--code); border-radius: 6px; white-space: pre; overflow: auto; max-height: 340px; }
.cols { width: 100%; border-collapse: collapse; font-size: 13px; }
.cols th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 2px 4px; }
.cols td { padding: 2px 4px; vertical-align: top; }
.cols input, .cols select { padding: 3px 6px; font-size: 13px; }
.hidden { display: none !important; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .row { grid-template-columns: 1fr; }
  #editor { padding: 12px 16px 60px; }
}
</style>
</head>
<body>
<header>
  <h1>設定ファイル作成ツール</h1>
  <span class="file" id="fileName">新規</span>
  <span class="spacer"></span>
  <button id="btnNew" type="button">新規</button>
  <label class="button" for="fileInput">開く…</label>
  <input id="fileInput" type="file" accept=".json,.jsonc,application/json" class="hidden">
  <button id="btnCopy" type="button">コピー</button>
  <button id="btnSave" type="button" class="primary">config.json を保存</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="editor"></main>
  <aside>
    <h3>確認</h3>
    <ul id="problems"></ul>
    <h3>config.json（プレビュー）</h3>
    <pre id="preview"></pre>
  </aside>
</div>

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && typeof v !== "string") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const isEmpty = (v) => v === undefined || v === "" || (Array.isArray(v) && v.length === 0) || (isObj(v) && Object.keys(v).length === 0);

/** JSONC（コメント・末尾のカンマつき）の JSON（プラグインの strip_jsonc と同じ扱い）。 */
function stripJsonc(text) {
  let out = "", i = 0, inStr = false;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (inStr) {
      out += c;
      if (c === "\\" && i + 1 < n) { out += text[i + 1]; i += 2; continue; }
      if (c === '"') inStr = false;
      i++;
      continue;
    }
    if (c === '"') { inStr = true; out += c; i++; }
    else if (text.startsWith("//", i)) { const e = text.indexOf("\n", i); i = e < 0 ? n : e; }
    else if (text.startsWith("/*", i)) {
      const e = text.indexOf("*/", i + 2);
      if (e < 0) throw new Error("閉じていないコメント");
      out += "\n".repeat((text.slice(i, e).match(/\n/g) || []).length);
      i = e + 2;
    } else { out += c; i++; }
  }
  let res = "";
  inStr = false;
  for (let j = 0; j < out.length; j++) {
    const c = out[j];
    if (inStr) {
      res += c;
      if (c === "\\" && j + 1 < out.length) { res += out[++j]; continue; }
      if (c === '"') inStr = false;
    } else if (c === '"') { inStr = true; res += c; }
    else if (c === ",") {
      let k = j + 1;
      while (k < out.length && " \t\r\n".includes(out[k])) k++;
      if (k < out.length && "}]".includes(out[k])) continue;
      res += c;
    } else res += c;
  }
  return res;
}
function loadJsonc(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  return JSON.parse(stripJsonc(text));
}
function download(name, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: name });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
/** 数・true/false・null に見える文字はその値に、ほかは文字列のまま。 */
function autoValue(s) {
  const t = s.trim();
  if (t === "") return undefined;
  if (/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
  if (t === "true") return true;
  if (t === "false") return false;
  if (t === "null") return null;
  return s;
}

// ---------------------------------------------------------------- 状態

let state = {};
let fileName = "config.json";
let current = "";               // 表示中の項目（"" は一覧）
const openCards = new WeakSet(); // 開いているカード
const STORE = "satellite_observation.config_builder";

function changed() {
  const text = JSON.stringify(state, null, 2) + "\n";
  document.getElementById("preview").textContent = text;
  const probs = check();
  const ul = document.getElementById("problems");
  ul.replaceChildren(...(probs.length ? probs.map((p) => el("li", { class: p.warn ? "warn" : "", text: p.text })) : [el("li", { text: "問題は見つからない（最後はプラグインの「設定…」で読み込んで確認）" })]));
  ul.className = probs.length ? "" : "none";
  for (const a of document.querySelectorAll("nav a[data-key]")) {
    const k = a.dataset.key;
    a.classList.toggle("set", k in state);
    a.classList.toggle("bad", probs.some((p) => p.key === k));
    const n = a.querySelector(".n");
    if (n) n.textContent = Array.isArray(state[k]) ? String(state[k].length) : "";
  }
  try { localStorage.setItem(STORE, JSON.stringify({ state, fileName })); } catch (e) { /* 保存できなくても動く */ }
}

// ---------------------------------------------------------------- 入力欄

/** 1 項目の欄。obj[f.k] を読み書きし、変えたら commit()（親への反映）と changed()。 */
function field(f, obj, commit, item) {
  if (f.showIf && !f.showIf(item || obj)) return null;
  const set = (v) => {
    if (v === undefined) delete obj[f.k]; else obj[f.k] = v;
    commit();
    changed();
  };
  const v = obj[f.k];
  if (f.t === "sample") return sampleBox(obj);
  if (f.t === "priority") return priorityField(f, obj, commit);
  if (f.t === "columns") return columnsField(f, obj, commit);
  if (f.t === "schema") return schemaField(f, obj, commit);
  if (f.t === "items") return itemsField(f, obj, commit);
  if (f.t === "object") return objectField(f, obj, commit);
  let control;
  // 読み込んだ値が欄の形と違うときは JSON のまま見せて壊さない。
  const mismatch = v !== undefined && !fits(f, v);
  const t = mismatch ? "json" : f.t;
  if (t === "text") {
    const dl = f.list ? el("datalist", { id: "dl" + Math.random().toString(36).slice(2) }, ...f.list().map((x) => el("option", { value: x }))) : null;
    control = el("span", {}, el("input", { type: "text", value: v ?? "", placeholder: f.ph || "", list: dl ? dl.id : null, oninput: (e) => set(e.target.value === "" ? undefined : e.target.value) }), dl);
  } else if (t === "number") {
    control = el("input", { type: "number", step: "any", value: v ?? "", placeholder: f.ph || "", min: f.min, max: f.max, oninput: (e) => {
      const s = e.target.value;
      e.target.classList.toggle("invalid", s !== "" && !isFinite(Number(s)));
      set(s === "" ? undefined : Number(s));
    } });
  } else if (t === "bool") {
    control = el("select", { onchange: (e) => set(e.target.value === "" ? undefined : e.target.value === "true") },
      el("option", { value: "", text: "未指定（既定）" }), el("option", { value: "true", text: "true", selected: v === true }), el("option", { value: "false", text: "false", selected: v === false }));
  } else if (t === "select") {
    const opts = (typeof f.opts === "function" ? f.opts() : f.opts).map(opt);
    if (v !== undefined && v !== null && !opts.some(([x]) => x === v)) opts.push([v, `${v}（いまの値）`]);
    const sel = el("select", { onchange: (e) => {
      const s = e.target.value;
      set(s === "" ? undefined : s === "\u0000null" ? null : s);
      if (f.rerender) render();
    } }, el("option", { value: "", text: f.ph ? `未指定（${f.ph}）` : "未指定" }),
      f.nullLabel ? el("option", { value: "\u0000null", text: f.nullLabel, selected: v === null }) : null,
      ...opts.map(([x, label]) => el("option", { value: x, text: label === x ? x : `${label}`, selected: v === x })));
    control = sel;
  } else if (t === "list") {
    control = el("input", { type: "text", value: Array.isArray(v) ? v.join(", ") : v ?? "", placeholder: f.ph || "カンマ区切り", oninput: (e) => {
      const parts = e.target.value.split(/[,、\n]/).map((s) => s.trim()).filter(Boolean);
      const vals = f.numbers ? parts.map(Number) : parts;
      e.target.classList.toggle("invalid", f.numbers && vals.some((x) => !isFinite(x)));
      set(vals.length ? vals : undefined);
    } });
  } else if (t === "textOrJson") {
    control = el("input", { type: "text", class: "mono", value: v === undefined ? "" : typeof v === "string" ? v : JSON.stringify(v), placeholder: f.ph || "", oninput: (e) => {
      const s = e.target.value.trim();
      if (s.startsWith("{") || s.startsWith("[")) {
        try { set(loadJsonc(s)); e.target.classList.remove("invalid"); } catch (err) { e.target.classList.add("invalid"); }
      } else set(s === "" ? undefined : s);
    } });
  } else if (t === "roles") {
    control = rolesField(f, obj, commit);
  } else if (t === "map") {
    control = mapField(f, obj, commit);
  } else {
    control = jsonArea(v, (x) => set(x), f.ph);
  }
  return el("div", { class: "row" },
    el("div", { class: "lab" }, f.l, f.req ? el("span", { class: "req", text: "*" }) : null, el("code", { text: f.k })),
    el("div", {}, control, f.help ? el("small", { text: f.help }) : null, mismatch ? el("small", { class: "err", text: "読み込んだ値の形がこの欄と違うため JSON のまま表示" }) : null));
}

function fits(f, v) {
  switch (f.t) {
    case "text": return typeof v === "string";
    case "number": return typeof v === "number";
    case "bool": return typeof v === "boolean";
    case "select": return typeof v === "string" || (v === null && !!f.nullLabel);
    case "list": return Array.isArray(v) && v.every((x) => typeof x === (f.numbers ? "number" : "string"));
    case "roles": case "map": return isObj(v);
    default: return true;
  }
}

function jsonArea(v, onValue, ph) {
  const msg = el("div", { class: "err" });
  const ta = el("textarea", { class: "mono", placeholder: ph || "JSON", oninput: (e) => {
    const s = e.target.value.trim();
    if (s === "") { ta.classList.remove("invalid"); msg.textContent = ""; onValue(undefined); return; }
    try { const x = loadJsonc(s); ta.classList.remove("invalid"); msg.textContent = ""; onValue(x); }
    catch (err) { ta.classList.add("invalid"); msg.textContent = "JSON として読めない: " + err.message; }
  } });
  ta.value = v === undefined ? "" : JSON.stringify(v, null, 2);
  ta.rows = Math.min(14, Math.max(3, ta.value.split("\n").length));
  return el("div", {}, ta, msg);
}

function rolesField(f, obj, commit) {
  const roles = Array.isArray(f.roles) ? f.roles.map((r) => [r, ""]) : Object.entries(f.roles);
  const get = () => (isObj(obj[f.k]) ? obj[f.k] : {});
  const grid = el("div", { class: "roles" });
  for (const [role, def] of roles) {
    const cur = get()[role];
    const required = (f.required || []).includes(role);
    grid.append(el("span", {}, ROLE_LABELS[role] || role, required ? el("span", { class: "req", text: "*" }) : null, el("code", { text: role })),
      el("input", { type: "text", class: "mono", value: Array.isArray(cur) ? cur.join(", ") : cur ?? "", placeholder: def || "", oninput: (e) => {
        const m = { ...get() };
        const parts = e.target.value.split(",").map((s) => s.trim()).filter(Boolean);
        if (!parts.length) delete m[role];
        else m[role] = (f.multi || []).includes(role) && parts.length > 1 ? parts : parts.join(",");
        e.target.classList.toggle("invalid", parts.some((p) => !ATTR.test(p)));
        if (isEmpty(m)) delete obj[f.k]; else obj[f.k] = m;
        commit();
        changed();
      } }));
  }
  const extra = Object.keys(get()).filter((r) => !roles.some(([x]) => x === r));
  return el("div", {}, grid,
    !Array.isArray(f.roles) ? el("small", { text: "空欄は薄字の既定の属性名" }) : null,
    extra.length ? el("small", { class: "err", text: `プラグインの知らない役割（そのまま残す）: ${extra.join("・")}` }) : null);
}

function mapField(f, obj, commit) {
  const conv = f.value === "number" ? (s) => (s.trim() === "" ? undefined : Number(s)) : f.value === "auto" ? autoValue : (s) => (s === "" ? undefined : s);
  const get = () => (isObj(obj[f.k]) ? obj[f.k] : {});
  const store = (m) => { if (isEmpty(m)) delete obj[f.k]; else obj[f.k] = m; commit(); changed(); };
  if (f.keys) {
    const grid = el("div", { class: "roles" });
    for (const key of f.keys) {
      grid.append(el("span", { text: key }), el("input", { type: f.value === "number" ? "number" : "text", value: showAuto(get()[key]), oninput: (e) => {
        const m = { ...get() };
        const x = conv(e.target.value);
        if (x === undefined) delete m[key]; else m[key] = x;
        store(m);
      } }));
    }
    return grid;
  }
  // 自由なキー: 行を並べ替えずに書き換える。
  const rows = Object.entries(get()).map(([a, b]) => [a, showAuto(b)]);
  const grid = el("div", { class: "pairs" });
  const commitRows = () => {
    const m = {};
    for (const [a, b] of rows) if (a.trim() !== "") { const x = conv(b); if (x !== undefined) m[a.trim()] = x; }
    store(m);
  };
  const draw = () => {
    grid.replaceChildren(el("span", { class: "note", text: f.keyHelp || "キー" }), el("span", { class: "note", text: f.valueHelp || "値" }), el("span"));
    rows.forEach((r, i) => {
      grid.append(el("input", { type: "text", value: r[0], oninput: (e) => { r[0] = e.target.value; commitRows(); } }),
        el("input", { type: "text", value: r[1], oninput: (e) => { r[1] = e.target.value; commitRows(); } }),
        el("button", { type: "button", class: "small danger", text: "×", onclick: () => { rows.splice(i, 1); commitRows(); draw(); } }));
    });
    grid.append(el("button", { type: "button", class: "small", text: "＋ 追加", onclick: () => { rows.push(["", ""]); draw(); } }));
  };
  draw();
  return grid;
}

function objectField(f, obj, commit) {
  const v = obj[f.k];
  const box = el("fieldset", {}, el("legend", { text: `${f.l}（${f.k}）` }));
  if (f.allowFalse) {
    const mode = v === false ? "false" : v === undefined ? "" : "obj";
    const radio = (val, label) => el("label", {}, el("input", { type: "radio", name: "m" + f.k + Math.random(), checked: mode === val, onchange: () => {
      if (val === "") delete obj[f.k]; else if (val === "false") obj[f.k] = false; else obj[f.k] = isObj(obj[f.k]) ? obj[f.k] : {};
      commit(); changed(); render();
    } }), label);
    box.append(el("div", { class: "choices" }, radio("", "未指定（既定）"), radio("false", f.allowFalse), radio("obj", "指定する")));
    if (mode !== "obj") return box;
  }
  if (v !== undefined && !isObj(v) && !f.allowFalse) {
    box.append(el("div", { class: "err", text: "オブジェクト以外の値。JSON で直す:" }), jsonArea(v, (x) => { if (x === undefined) delete obj[f.k]; else obj[f.k] = x; commit(); changed(); }));
    return box;
  }
  const sub = isObj(obj[f.k]) ? obj[f.k] : {};
  const subCommit = () => {
    if (isEmpty(sub) && !f.allowFalse) delete obj[f.k]; else obj[f.k] = sub;
    commit();
  };
  for (const g of f.fields) { const r = field(g, sub, subCommit, sub); if (r) box.append(r); }
  extraNote(sub, f.fields, box);
  return box;
}

function extraNote(obj, fields, box) {
  const known = new Set(fields.map((g) => g.k));
  const extra = Object.keys(obj).filter((k) => !known.has(k));
  if (extra.length) box.append(el("small", { class: "note", text: `この欄にないキー（そのまま残す）: ${extra.join("・")}` }));
}

function itemsField(f, obj, commit) {
  if (obj[f.k] !== undefined && !Array.isArray(obj[f.k])) {
    if (isObj(obj[f.k])) obj[f.k] = [obj[f.k]]; // satelliteAliases などの 1 件だけのオブジェクト
    else return el("div", {}, el("div", { class: "err", text: `${f.k} は配列で指定。JSON で直す:` }), jsonArea(obj[f.k], (x) => { if (x === undefined) delete obj[f.k]; else obj[f.k] = x; changed(); }));
  }
  const list = obj[f.k] || [];
  const wrap = el("div", {});
  const store = () => { if (list.length) obj[f.k] = list; else delete obj[f.k]; commit(); changed(); };
  const probs = check();
  list.forEach((item, i) => {
    if (!isObj(item)) {
      wrap.append(el("div", { class: "card" }, el("div", { class: "body" }, el("div", { class: "err", text: `${i + 1} 件目はオブジェクト以外。JSON で直す:` }),
        jsonArea(item, (x) => { list[i] = x; store(); }))));
      return;
    }
    const at = `${f.k}[${i}]`;
    const title = (f.title ? f.title(item) : item.label || item.name) || `${f.l} ${i + 1}`;
    const body = el("div", { class: "body" });
    const card = el("details", { class: "card" + (probs.some((p) => p.at && p.at.startsWith(at)) ? " bad" : ""), open: openCards.has(item) || list.length === 1, ontoggle: (e) => {
      if (e.target !== card) return;
      if (card.open) { openCards.add(item); if (!body.firstChild) fill(); } else openCards.delete(item);
    } });
    const fill = () => {
      for (const g of f.fields) { const r = field(g, item, () => { commit(); }, item); if (r) body.append(r); }
      extraNote(item, f.fields, body);
    };
    const tool = (text, fn, cls = "small") => el("button", { type: "button", class: cls, text, onclick: (e) => { e.preventDefault(); e.stopPropagation(); fn(); } });
    card.append(el("summary", {}, el("span", { class: "title", text: title }), el("span", { class: "sub", text: item.url || "" }),
      el("span", { class: "tools" },
        i > 0 ? tool("↑", () => { list.splice(i - 1, 0, list.splice(i, 1)[0]); store(); render(); }) : null,
        i < list.length - 1 ? tool("↓", () => { list.splice(i + 1, 0, list.splice(i, 1)[0]); store(); render(); }) : null,
        tool("複製", () => { const c = structuredClone(item); list.splice(i + 1, 0, c); openCards.add(c); store(); render(); }),
        tool("削除", () => { list.splice(i, 1); store(); render(); }, "small danger"))), body);
    if (card.open) fill();
    wrap.append(card);
  });
  wrap.append(el("div", { class: "bar" }, el("button", { type: "button", text: `＋ ${f.l}を追加`, onclick: () => {
    const it = {};
    list.push(it);
    openCards.add(it);
    obj[f.k] = list;
    commit(); changed(); render();
  } })));
  return wrap;
}

// ---------------------------------------------------------------- 日次出力: 優先度・列・JSON Schema

function priorityField(f, obj, commit) {

      el("p", { class: "help", text: "プラグインが読まない項目（ビューアだけの項目など）。そのまま残して保存する。ここで直接書き足すこともできる。" }),
      jsonArea(isEmpty(other) ? undefined : other, (x) => {
        for (const k of Object.keys(state)) if (!known.has(k)) delete state[k];
        if (isObj(x)) for (const [k, v] of Object.entries(x)) if (!known.has(k)) state[k] = v;
        changed();
      }, '{ "viewerOnlyKey": … }'),
      el("h3", { text: "設定ファイル全体を JSON で直す" }),
      jsonArea(state, (x) => { if (isObj(x)) { state = x; changed(); } }));
  } else {
    const spec = ALL.find((k) => k.key === current);
    const docLink = spec.ext ? el("a", { href: "../" + spec.ext, target: "_blank", text: spec.ext }) : spec.doc ? el("a", { href: "../README.md#" + spec.doc, target: "_blank", text: "README の説明" }) : null;
    ed.replaceChildren(el("h2", { class: "key" }, spec.label, el("code", { text: spec.key })),
      el("p", { class: "help" }, spec.help, docLink ? " 詳しく: " : "", docLink),
      field(spec.field, state, () => {}, state),
      spec.key in state ? el("div", { class: "bar" }, el("button", { type: "button", class: "small danger", text: "この項目を消す", onclick: () => { delete state[spec.key]; changed(); render(); } })) : null);
  }
  ed.scrollTop = scroll;
  changed();
}

function setState(value, name) {
  if (!isObj(value)) { alert("いちばん外がオブジェクトの JSON ではない"); return; }
  state = value;
  fileName = name || "config.json";
  document.getElementById("fileName").textContent = name || "新規";
  render();
}

document.getElementById("btnNew").onclick = () => { if (isEmpty(state) || confirm("いまの内容を消して新しく始める？")) { setState({}, ""); go(""); } };
document.getElementById("fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { setState(loadJsonc(await file.text()), file.name); } catch (err) { alert(`${file.name} を JSON として読めない: ${err.message}`); }
};
document.getElementById("btnSave").onclick = () => {
  const probs = check().filter((p) => !p.warn);
  if (probs.length && !confirm(`確認で ${probs.length} 件の問題がある。このまま保存する？（プラグインはその項目を既定に戻して起動する）`)) return;
  download(fileName.replace(/\.jsonc$/, ".json") || "config.json", JSON.stringify(state, null, 2) + "\n");
};
document.getElementById("btnCopy").onclick = async () => {
  const text = JSON.stringify(state, null, 2) + "\n";
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = el("textarea", { value: text });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const b = document.getElementById("btnCopy");
  b.textContent = "コピーした";
  setTimeout(() => { b.textContent = "コピー"; }, 1200);
};

(function start() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && isObj(saved.state)) { state = saved.state; fileName = saved.fileName || "config.json"; document.getElementById("fileName").textContent = isEmpty(state) ? "新規" : `${fileName}（前回の続き）`; }
  } catch (e) { /* 前回の内容がなくても動く */ }
  const hash = decodeURIComponent(location.hash.slice(1));
  current = ALL.some((k) => k.key === hash) || hash === "__other" ? hash : "";
  render();
})();
</script>
</body>
